openapi: 3.1.0
info:
  title: AI Wardrobe API
  version: 1.0.0
paths:
  /v1/health:
    get:
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            correlation_id: { type: string }
            details: { type: object, additionalProperties: true }
