packages:
  - apps/web
  - apps/admin
  - apps/backend
  - packages/*

# Prisma 6.19.3 and current Prisma 7 releases pin deepmerge-ts@7.1.5.
# Reassess when Prisma updates @prisma/config to deepmerge-ts >=8.0.0.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - unrs-resolver

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - esbuild
  - prisma
  - sharp
